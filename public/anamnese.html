<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anamnese Digital - TattooHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    body { display: block; height: auto; min-height: 100vh; overflow: auto; padding: 2rem 1rem; }
    main { max-width: 680px; margin: 0 auto; background: var(--bg-surface); border: 2px solid var(--border-color); padding: 2rem; box-shadow: 8px 8px 0 var(--primary); }
    h1 { margin-bottom: 0.5rem; color: var(--primary); }
    #public-questions { display: grid; gap: 1rem; margin: 1.5rem 0; }
    .public-field { display: grid; gap: 0.45rem; }
    .public-field input, .public-field select, .public-field textarea { padding: 0.8rem; background: var(--bg-base); border: 1px solid var(--border-color); color: var(--text-main); }
    .public-field label { font-weight: 600; }
    #form-message { margin: 1rem 0; }
    @media (max-width: 600px) { main { padding: 1.2rem; } }
  </style>
</head>
<body>
  <main>
    <h1 id="studio-title">Anamnese Digital</h1>
    <p>Preencha as informações abaixo antes da sua sessão.</p>
    <div id="form-message" role="status"></div>
    <form id="anamnesis-form" hidden>
      <div class="public-field">
        <label for="client-name">Nome completo *</label>
        <input id="client-name" name="clienteNome" required maxlength="120">
      </div>
      <div class="public-field">
        <label for="client-phone">Telefone</label>
        <input id="client-phone" name="clienteTelefone" type="tel">
      </div>
      <div class="public-field">
        <label for="client-birth">Data de nascimento</label>
        <input id="client-birth" name="clienteNascimento" type="date">
      </div>
      <div class="public-field">
        <label for="selected-artist">Artista</label>
        <select id="selected-artist" name="artistaSelecionado"><option value="">Selecione</option></select>
      </div>
      <div id="public-questions"></div>
      <label class="public-field" style="display:flex;grid-template-columns:auto 1fr;align-items:start;">
        <input id="accepted-terms" type="checkbox" required style="margin-top:0.2rem;">
        <span>Confirmo que as informações fornecidas são verdadeiras e aceito o termo de responsabilidade. *</span>
      </label>
      <button class="btn" type="submit">Enviar ficha</button>
    </form>
  </main>
  <script type="module" src="/js/public-anamnese.js"></script>
</body>
</html>
